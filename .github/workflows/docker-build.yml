name: Verify Vercel Container

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Vercel container
        run: docker build -f Dockerfile.vercel -t employee-management-vercel:test .